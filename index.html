<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova — Ship Faster, Break Less</title>
<meta name="description" content="Nova is a modern platform for teams that ship fast.">
<style>
:root{
  --bg:#0b0d12; --bg2:#0f131c; --card:#141924; --border:#232a3a;
  --text:#e9ecf3; --muted:#8b93a7;
  --accent:#6d5efc; --accent2:#22d3ee;
  --radius:16px; --max:1140px;
  --shadow:0 18px 50px -18px rgba(0,0,0,.65);
}
[data-theme="light"]{
  --bg:#ffffff; --bg2:#f6f7fb; --card:#ffffff; --border:#e5e8f0;
  --text:#0c1017; --muted:#5b6478;
  --shadow:0 18px 45px -22px rgba(16,24,40,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.65;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 22px}
.grad{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- header ---------- */
header{
  position:fixed;inset:0 0 auto 0;z-index:100;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.3s;
}
header.stuck{border-bottom-color:var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.15rem}
.logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 22px -4px var(--accent)}
.menu{display:flex;align-items:center;gap:30px;font-size:.94rem;color:var(--muted)}
.menu a{transition:.2s}.menu a:hover{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:12px}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:10px;
  border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:.2s
}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.burger{display:none}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:999px;font-weight:650;font-size:.94rem;
  border:1px solid transparent;cursor:pointer;transition:.22s;white-space:nowrap
}
.btn-primary{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 30px -12px var(--accent)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 38px -12px var(--accent)}
.btn-ghost{border-color:var(--border);background:transparent;color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);background:var(--card)}

/* ---------- hero ---------- */
.hero{position:relative;padding:150px 0 90px;text-align:center;overflow:hidden}
.hero::before{
  content:"";position:absolute;top:-260px;left:50%;transform:translateX(-50%);
  width:900px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(109,94,252,.30),transparent 62%);filter:blur(30px);pointer-events:none
}
.hero::after{
  content:"";position:absolute;top:60px;right:-140px;width:520px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.20),transparent 65%);filter:blur(40px);pointer-events:none
}
.hero > *{position:relative;z-index:2}
.pill{
  display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);font-size:.82rem;color:var(--muted);margin-bottom:26px
}
.pill b{color:var(--text);font-weight:650}
.pill .live{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
h1{font-size:clamp(2.3rem,6vw,4.1rem);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin-bottom:22px}
.lead{font-size:clamp(1rem,2vw,1.16rem);color:var(--muted);max-width:620px;margin:0 auto 34px}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.note{margin-top:18px;font-size:.83rem;color:var(--muted)}

/* ---------- logos ---------- */
.logos{padding:34px 0 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:70px}
.logos p{text-align:center;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.logo-row{display:flex;justify-content:center;gap:48px;flex-wrap:wrap;opacity:.55;font-weight:750;font-size:1.05rem;letter-spacing:-.02em}

/* ---------- sections ---------- */
section{padding:96px 0}
.head{text-align:center;max-width:640px;margin:0 auto 56px}
.tag{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
h2{font-size:clamp(1.7rem,4vw,2.5rem);letter-spacing:-.03em;line-height:1.15;margin-bottom:14px;font-weight:780}
.head p{color:var(--muted)}

.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px;transition:.25s
}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow)}
.ico{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:18px;
  background:linear-gradient(135deg,rgba(109,94,252,.20),rgba(34,211,238,.16));
  border:1px solid var(--border);font-size:1.2rem
}
.card h3{font-size:1.05rem;margin-bottom:8px;letter-spacing:-.01em}
.card p{color:var(--muted);font-size:.92rem}

/* ---------- stats ---------- */
.stats{background:var(--bg2);border-block:1px solid var(--border)}
.stat{text-align:center}
.stat .num{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.04em;background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:.9rem}

/* ---------- pricing ---------- */
.price{display:flex;flex-direction:column}
.price.pop{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow);position:relative}
.badge{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;
  font-size:.72rem;font-weight:700;padding:5px 14px;border-radius:999px;letter-spacing:.05em
}
.amount{font-size:2.5rem;font-weight:800;letter-spacing:-.04em;margin:14px 0 4px}
.amount small{font-size:.85rem;font-weight:500;color:var(--muted)}
.price ul{list-style:none;margin:22px 0 26px;display:grid;gap:11px;font-size:.9rem;color:var(--muted)}
.price li::before{content:"✓";color:var(--accent2);font-weight:800;margin-right:9px}
.price .btn{margin-top:auto;width:100%}

/* ---------- contact ---------- */
.contact{background:var(--bg2);border-top:1px solid var(--border)}
.form{display:grid;gap:16px;max-width:560px;margin:0 auto}
.field{display:grid;gap:7px}
label{font-size:.85rem;font-weight:600}
input,textarea{
  width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font:inherit;font-size:.94rem;transition:.2s
}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,94,252,.16)}
textarea{res
